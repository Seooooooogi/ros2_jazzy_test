# 컨테이너 dev override · 코드 수정 live-mount + 노드 수동 기동(디버깅용)
#   base(docker-compose.yml) 와 병합: docker compose -f containers/docker-compose.yml -f containers/docker-compose.dev.yml up -d yolo-detection
#   차이 = build.target=builder / 소스 live bind-mount / 노드 auto-run off / 별도 태그(dev-builder)

services:
  yolo-detection:
    image: docker.io/${DOCKERHUB_USER:-local}/ros2-jazzy-yolo:dev-builder
    build:
      target: builder
    working_dir: /ws
    volumes:
      - ${YOLO_WS:-${HOME}/cobot2_ws/src/cobot2/yolo_container}:/ws/src
      - yolo_build:/ws/build
      - yolo_install:/ws/install
      - ./dev/bashrc:/root/.bashrc:ro
      # 컨테이너 안 YOLO 학습 작업 디렉토리(데이터셋 + runs/ 산출물을 host 에 보존)
      - ${YOLO_TRAIN_DIR:-${HOME}/yolo_train}:/train
    # $$ROS_DISTRO = compose 가 $ 한 개로 축약 → 컨테이너 안에서 런타임 확장
    command: ["bash", "-c", "set +u; source /opt/ros/$$ROS_DISTRO/setup.bash; find /ws/build /ws/install -mindepth 1 -delete 2>/dev/null || true; colcon build --symlink-install --merge-install; sleep infinity"]
    # 컨테이너 안 YOLO 학습용 /dev/shm 상한(기본 64MB → DataLoader worker 사망)
    shm_size: "8gb"
    restart: "no"

# colcon 빌드 산출물 영속화(소스 = host bind-mount, 볼륨 = 빌드 산출물만)
#   초기화 = docker compose ... down -v
volumes:
  yolo_build:
  yolo_install:
