# 컨테이너 ALSA 기본 캡처 장치 지정 (fallback 용).
#
# 이 하드웨어(Raptor Lake cAVS)에는 Digital Microphone(DMIC)이 두 개의 ALSA capture device 로 노출된다.
# 둘은 노이즈 특성이 크게 다르다(실측):
#   - hw:1,6 (card1 device6, 48kHz 계열) : 노이즈 플로어가 매우 높다. 정적에서도 RMS≈2300,
#     16kHz 로 변환하면 풀스케일 클리핑(peak 32768)·정적 RMS≈3600 까지 치솟아
#     wakeword 신호가 잡음에 묻힌다 → confidence 가 0 부근(≈0.001)에 머물러 탐지 실패.
#   - hw:1,7 (card1 device7, 16kHz 네이티브 DMIC) : 깨끗하다. 정적 RMS≈180, 발화 RMS≈1200,
#     클리핑 없음. 이 장치로 "Hello Rokey" wakeword confidence 가 0.7+ 까지 올라 정상 탐지된다.
#   - hw:1,0 (HDA Analog) : 아날로그 마이크 미연결로 무음(RMS≈2).
#
# 중요: wakeword/STT 캡처 코드는 ALSA 기본값(plug)에 의존하지 않고 16kHz 네이티브 DMIC(hw:1,7)를
# PortAudio 로 직접 연다(voice_processing/audio_device.py). 이 SOF 칩의 ALSA plug 는 캡처 resample 이
# 불안정해(이중 resample 시 왜곡 confidence≈0.01, slave rate 고정 시 무음) 신뢰할 수 없기 때문이다.
# 아래 default 정의는 `arecord -D default` 같은 ALSA-기본값 소비자를 위한 fallback 일 뿐이다.
#
# card/device 번호는 하드웨어 종속(동일 모델 fleet 가정). 다른 사운드 칩이면 `arecord -l` 로 DMIC 확인 후
# 후보 device 의 정적/발화 RMS 를 재 가장 깨끗한(저노이즈·비클리핑) device 로 조정하고,
# 코드 쪽은 VOICE_MIC_DEVICE 환경변수로 그 device 를 지정한다.
pcm.!default {
    type plug
    slave.pcm "hw:1,7"
}
ctl.!default {
    type hw
    card 1
}
