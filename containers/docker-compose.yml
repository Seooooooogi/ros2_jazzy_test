# application 컨테이너(yolo) · 서비스 base 정의
#   voice = 컨테이너 아님, host 실행(app-install.sh voice)
#   기본 통합 실행 = bash containers/bringup.sh(이 base + docker-compose.dev.yml 병합)
# 카메라 = host 소유 → /camera/* 토픽 publish 는 통합 bringup 담당
# 전제 = hostcfg.sh dds 선행(아래 서비스가 read-only mount 하는 cyclonedds.xml 렌더)
# 사용: docker compose -f containers/docker-compose.yml up -d(에뮬레이터 포함 = --profile dev)
# compose 직접 build = config.sh 를 환경에 올린 뒤 실행
#   set -a; source resources/config.sh; set +a; docker compose ... build

services:
  yolo-detection:
    container_name: yolo-detection   # 고정 이름 — dev override 도 상속(`docker exec -it yolo-detection`). 미설정 시 <project>-<svc>-1.
    image: docker.io/${DOCKERHUB_USER:-local}/ros2-jazzy-yolo:${YOLO_TAG:-dev}
    build:
      context: ..
      dockerfile: containers/yolo-detection/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CUDA_VERSION: ${CUDA_VERSION:-12.8}
    network_mode: host          # DDS discovery — host robot_control(client)/카메라 토픽 ↔ 컨테이너.
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # host 와 동일 RMW 필수 → 같은 topic/service 가시
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=file:///cyclonedds.xml
    volumes:
      # hostcfg.sh dds 가 렌더한 cyclonedds 설정 = read-only mount
      - ${CYCLONEDDS_XML:-${HOME}/.config/cyclonedds/cyclonedds.xml}:/cyclonedds.xml:ro
    deploy:                     # GPU 예약 — 런타임 필드(빌드엔 무영향). nvidia-container-toolkit 필요(host).
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # --- 후속(통합) 단계에서 활성화 ---
    # volumes:
    #   - ./models/yolov8n_tools_0122.pt:/ws/install/share/object_detection/resource/yolov8n_tools_0122.pt:ro

  dsr-emulator:                 # 실기 우선 — 개발/테스트 시에만 명시적 활성화
    image: doosanrobot/dsr_emulator:3.0.1
    profiles: [dev]
    network_mode: host
    restart: unless-stopped
