# Phase 4 application 컨테이너 (yolo) — 서비스 base 정의. voice 는 컨테이너 아님 — host 실행(voice-host-install.sh).
#
# 기본 통합 실행은 이 base + dev override 를 머지한 dev-builder 경로다:
#   bash containers/bringup.sh   (= -f docker-compose.yml -f docker-compose.dev.yml, live-mount + 컨테이너 안 colcon build)
# 이 base 를 단독으로 `up` 하면 runtime(최종) 이미지·노드 auto-run 경로가 되는데, 학습 기본 흐름은
# 그걸 빌드하지 않는다(수동 runtime/publish 용으로만 보존). 빌드 게이트는 build-all.sh 가 builder 스테이지를 빌드/검증.
# install.sh 는 이 파일을 자동 호출하지 않는다 — host(설치) / application(컨테이너) 책임 분리.
#
# 카메라는 host 소유다. yolo 컨테이너를 올리기 전에 host 에서 realsense2_camera 노드가 떠서
# /camera/* 토픽을 publish 하고 있어야 한다 (align_depth 필수). 그 역할은 통합 bringup 이 맡는다:
#   ros2 launch m0609_rg2_bringup bringup.launch.py camera:=true
# (`bash containers/bringup.sh` 는 사용자가 camera:= 를 안 주면 camera:=true 를 자동으로 덧붙인다.
#  기존 `rs_launch.py align_depth.enable:=true` 를 이 진입점이 대체한다 — 토픽 이름은 그대로다.
#  새 launch 도 realsense2_camera_node 를 namespace/name 둘 다 'camera' 로 띄워 rs_launch.py
#  기본값과 같은 /camera/* 를 내고, align_depth·enable_rgbd·enable_sync·pointcloud 를 켠다.)
# 누락 시 aligned_depth_to_color 가 안 떠 object_detection 의 depth 계산이 실패한다.
#
# 전제: dds-tuning.sh(install.sh 마지막 step 또는 단독 실행)가 먼저 끝나 있어야 한다.
# 그게 host 에 cyclonedds.xml 을 렌더하는데, 아래 서비스가 이 파일을 read-only mount 하므로
# 없으면 mount 실패로 컨테이너가 안 뜬다.
#
# 사용 (host 검증 + 카메라 기동 이후):
#   cp .env.example .env  # DOCKERHUB_USER / YOLO_TAG (OPENAI_API_KEY 는 host voice 용 — 이 compose 는 안 읽음)
#   docker compose -f containers/docker-compose.yml up -d
# 에뮬레이터까지: docker compose --profile dev up -d
#
# compose 로 직접 build 할 때는 distro 단일 진실 소스(config.sh)를 환경에 올린 뒤 실행:
#   set -a; source resources/config.sh; set +a; docker compose ... build
# (ROS_DISTRO 미설정 시 아래 build args 의 :-jazzy fallback 적용. 권장 빌드 경로는 build-all.sh.)

services:
  yolo-detection:
    container_name: yolo-detection   # 고정 이름 — dev override 도 상속(`docker exec -it yolo-detection`). 미설정 시 <project>-<svc>-1.
                                      # 트레이드오프: 같은 데몬에서 prod/dev 동시 기동·scale 불가(단일 인스턴스 전제).
    image: docker.io/${DOCKERHUB_USER:-local}/ros2-jazzy-yolo:${YOLO_TAG:-dev}
    build:
      context: ..
      dockerfile: containers/yolo-detection/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CUDA_VERSION: ${CUDA_VERSION:-12.8}
    network_mode: host          # DDS discovery — host robot_control(client)/카메라 토픽 ↔ 컨테이너.
                                # host net namespace 공유 → 유선 NIC·커널 소켓 버퍼(sysctl)를
                                # host 와 그대로 공유하므로 cyclonedds.xml 의 NIC whitelist·버퍼가
                                # 컨테이너에도 적용된다(컨테이너 내 별도 sysctl 불필요).
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # host 와 동일 RMW 여야 같은 topic/service 가 보인다 (혼합 시 discovery 실패). 표준=cyclonedds.
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=file:///cyclonedds.xml
    volumes:
      # host 가 dds-tuning.sh 로 렌더한 cyclonedds 설정을 컨테이너에 read-only mount.
      - ${CYCLONEDDS_XML:-${HOME}/.config/cyclonedds/cyclonedds.xml}:/cyclonedds.xml:ro
    deploy:                     # GPU 예약 — 런타임 필드(빌드엔 무영향). nvidia-container-toolkit 필요(host).
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # --- 후속(통합) 단계에서 활성화 ---
    # 카메라는 host 소유 → USB passthrough 불필요 (host realsense2_camera 가 토픽 publish).
    # volumes:
    #   - ./models/yolov8n_tools_0122.pt:/ws/install/share/object_detection/resource/yolov8n_tools_0122.pt:ro

  yolo-viz:                     # 시각화 전용 — color 스트림 연속추론 → /yolo/detections (host viewer 가 구독).
    # dev-builder(yolo) 이미지를 재사용한다(신규/무태그 이미지 없음). 노드 본문은 build 된
    # object_detection 서비스와 별개로, 마운트한 스크립트를 직접 실행한다
    # → 이미지 재빌드/재배포 없이 viz 노드만 추가·수정 가능. viz 는 /ws bind-mount 없이
    #   builder 가 baked 한 /ws/install overlay 를 그대로 쓴다(소스 편집 대상 아님).
    image: docker.io/${DOCKERHUB_USER:-local}/ros2-jazzy-yolo:dev-builder
    profiles: [viz]             # opt-in — 프로덕션 up 에 자동 포함 안 됨. `--profile viz` 로만 기동.
    network_mode: host          # host net namespace 공유 → cyclonedds NIC whitelist·버퍼 상속(카메라 토픽 수신).
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=file:///cyclonedds.xml
      - PYTHONUNBUFFERED=1       # 모델 로드·추론 로그를 docker logs 에 실시간 노출.
    volumes:
      - ${CYCLONEDDS_XML:-${HOME}/.config/cyclonedds/cyclonedds.xml}:/cyclonedds.xml:ro
      # `../` 는 의도적 — compose 파일이 containers/ 에 있어 volume 상대경로는 파일 기준이다.
      # repo-root 의 viz/live_detection.py 를 가리키려면 한 단계 위로 올라간다.
      - ../viz/live_detection.py:/opt/viz/live_detection.py:ro
      # builder 이미지엔 runtime entrypoint 가 없다 → dev/bashrc 를 /root/.bashrc 로 mount 해
      # ROS overlay 를 command 에서 source 한다(dev 서비스와 동일 recipe).
      - ./dev/bashrc:/root/.bashrc:ro
    deploy:                     # GPU 예약 — yolo-detection 과 동일.
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # builder 이미지엔 entrypoint 가 없어 mount 한 /root/.bashrc 로 ROS overlay 를 source 한 후 실행.
    # 카메라 토픽은 스크립트가 상대 이름으로 구독하고 여기서 remap 으로 붙인다
    # (절대 경로를 스크립트에 박지 않기 위함 — 카메라 이름이 바뀌면 이 줄만 고친다).
    command: ["bash", "-c", "source /root/.bashrc; exec python3 /opt/viz/live_detection.py --ros-args -r color/image_raw:=/camera/color/image_raw"]

  dsr-emulator:                 # 실기 우선 — 개발/테스트 시에만 명시적 활성화
    image: doosanrobot/dsr_emulator:3.0.1
    profiles: [dev]
    network_mode: host
    restart: unless-stopped
