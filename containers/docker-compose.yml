# application 컨테이너(yolo) · 서비스 base 정의
#   voice = 컨테이너 아님, host 실행(app-install.sh voice)
#
# 기본 통합 실행 = 이 base + dev override 를 병합한 dev-builder 경로:
#   bash containers/bringup.sh   (= -f docker-compose.yml -f docker-compose.dev.yml, live-mount + 컨테이너 안 colcon build)
# 이 base 단독 `up` = runtime(최종) 이미지·노드 auto-run 경로
#   학습 기본 흐름 = 그것을 빌드하지 않음(수동 runtime/publish 용으로만 보존)
#   빌드 게이트 = build-all.sh 가 builder 스테이지 빌드/검증
# install.sh = 이 파일 자동 호출 없음(이유: host(설치) / application(컨테이너) 책임 분리)
#
# 카메라 = host 소유
#   yolo 컨테이너 기동 전에 host 의 realsense2_camera 노드가 떠서 /camera/* 토픽 publish 중이어야 함
#   align_depth 필수
#   담당 = 통합 bringup:
#     ros2 launch m0609_rg2_bringup bringup.launch.py camera:=true
#   `bash containers/bringup.sh` = 사용자가 camera:= 미지정 시 camera:=true 자동 부착
#   이 진입점 = 기존 `rs_launch.py align_depth.enable:=true` 대체
#   구 rs_launch.py 기본 = /camera/camera/*(드라이버 private 토픽 + upstream 이 노드 기본 ns 를 /camera 로 고정 → 중복)
#   토픽 경로 = realsense2_camera_node 를 namespace='/' + name='camera' 로 기동해 그 중복을 제거한 /camera/*
#     동시에 align_depth·enable_rgbd·enable_sync·pointcloud on
#   소비자 = 그 경로를 절대 이름으로 구독 → 기동 시 remap 인자 불필요
#   누락 시 aligned_depth_to_color 미기동 → object_detection 의 depth 계산 실패
#
# 전제: hostcfg.sh dds 선행 완료(install.sh 경유 또는 단독 실행)
#   그 단계 = host 에 cyclonedds.xml 렌더
#   아래 서비스 = 이 파일을 read-only mount → 부재 시 mount 실패 → 컨테이너 미기동
#
# 사용 (host 검증 + 카메라 기동 이후):
#   cp .env.example .env  # DOCKERHUB_USER / YOLO_TAG (OPENAI_API_KEY = host voice 용, 이 compose 는 미독해)
#   docker compose -f containers/docker-compose.yml up -d
# 에뮬레이터까지: docker compose --profile dev up -d
#
# compose 로 직접 build 할 때 = distro 단일 진실 소스(config.sh)를 환경에 올린 뒤 실행:
#   set -a; source resources/config.sh; set +a; docker compose ... build
#   ROS_DISTRO 미설정 → 아래 build args 의 :-jazzy fallback 적용
#   권장 빌드 경로 = build-all.sh

services:
  yolo-detection:
    container_name: yolo-detection   # 고정 이름 — dev override 도 상속(`docker exec -it yolo-detection`). 미설정 시 <project>-<svc>-1.
                                      # 트레이드오프: 같은 데몬에서 prod/dev 동시 기동·scale 불가(단일 인스턴스 전제).
    image: docker.io/${DOCKERHUB_USER:-local}/ros2-jazzy-yolo:${YOLO_TAG:-dev}
    build:
      context: ..
      dockerfile: containers/yolo-detection/Dockerfile
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        CUDA_VERSION: ${CUDA_VERSION:-12.8}
    network_mode: host          # DDS discovery — host robot_control(client)/카메라 토픽 ↔ 컨테이너.
                                # host net namespace 공유 → 유선 NIC·커널 소켓 버퍼(sysctl)를
                                # host 와 그대로 공유
                                # → cyclonedds.xml 의 NIC whitelist·버퍼가 컨테이너에도 적용
                                # → 컨테이너 내 별도 sysctl 불필요
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # host 와 동일 RMW 필수 → 같은 topic/service 가시(혼합 시 discovery 실패). 표준 = cyclonedds
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - CYCLONEDDS_URI=file:///cyclonedds.xml
    volumes:
      # host 가 hostcfg.sh dds 로 렌더한 cyclonedds 설정 = 컨테이너에 read-only mount
      - ${CYCLONEDDS_XML:-${HOME}/.config/cyclonedds/cyclonedds.xml}:/cyclonedds.xml:ro
    deploy:                     # GPU 예약 — 런타임 필드(빌드엔 무영향). nvidia-container-toolkit 필요(host).
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # --- 후속(통합) 단계에서 활성화 ---
    # 카메라 = host 소유 → USB passthrough 불필요(host realsense2_camera 가 토픽 publish)
    # volumes:
    #   - ./models/yolov8n_tools_0122.pt:/ws/install/share/object_detection/resource/yolov8n_tools_0122.pt:ro

  dsr-emulator:                 # 실기 우선 — 개발/테스트 시에만 명시적 활성화
    image: doosanrobot/dsr_emulator:3.0.1
    profiles: [dev]
    network_mode: host
    restart: unless-stopped
